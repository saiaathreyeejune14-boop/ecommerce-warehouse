version: 2

models:
  - name: dim_customers
    description: "One row per customer"
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_products
    description: "One row per product"
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: fct_orders
    description: "One row per order, with revenue"
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled', 'returned']